name: Build ISO (kiwi)

# A SEPARATE workflow on purpose. build-iso.yml stays exactly as it is, red and
# all, so this path can be proven before anything is retired. Manual dispatch
# only: it should not add noise to the pipeline until it has produced an ISO.
#
# Why kiwi: anaconda's payload downloader fails partway through this build every
# time ("Failed to download the following packages", ~800 MiB into 1.45 GiB),
# across six attempts and every retry strategy tried. kiwi installs packages
# with dnf directly and has no equivalent downloader, so it sidesteps the
# failure rather than working around it. Fedora is also moving live ISOs from
# lorax to kiwi, so this is the direction upstream is going.

on:
  # Runs itself on any change to the build path. Dispatching by hand meant every
  # fix waited for someone to tap a button — which is not automation, it's a
  # reminder. build-iso.yml ignores these same paths, so the distro pipeline is
  # not triggered by kiwi work.
  push:
    paths:
      - 'packages/distro-iso-builder/kiwi/**'
      - 'scripts/ci-kiwi-build.sh'
      - '.github/workflows/build-iso-kiwi.yml'
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Name for the ISO (informational)'
        required: false
        default: 'kiwi'

permissions:
  contents: read

jobs:
  build-kiwi:
    name: Build live ISO with kiwi-ng
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space (kiwi needs ~20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Build with kiwi-ng (Fedora 44 container)
        # docker directly, not addnab/docker-run-action. That action received an
        # empty `image` input on this workflow and tried to pull a mangled tag
        # ("pull access denied for 916ccf:2bc7b25a…") on three consecutive runs,
        # even with the input present in the step's `with:` block. Calling docker
        # here removes the dependency and makes the command line explicit.
        #
        # --privileged is required: kiwi needs loop devices and mounts to
        # assemble the ISO. This is the main structural difference from the
        # livemedia-creator pipeline.
        run: |
          docker run --rm --privileged \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            fedora:44 \
            bash /workspace/scripts/ci-kiwi-build.sh

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kaal-os-live-iso-kiwi
          path: |
            kiwi-out/**/*.iso
            kiwi-out/**/*.iso.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload kiwi build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-build-log
          path: |
            kiwi-out/**/*.log
            kiwi-out/build/
          if-no-files-found: warn
          retention-days: 7
