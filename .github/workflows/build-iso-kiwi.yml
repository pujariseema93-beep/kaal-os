name: Build ISO (kiwi)

# A SEPARATE workflow on purpose. build-iso.yml stays exactly as it is, red and
# all, so this path can be proven before anything is retired. Manual dispatch
# only: it should not add noise to the pipeline until it has produced an ISO.
#
# Why kiwi: anaconda's payload downloader fails partway through this build every
# time ("Failed to download the following packages", ~800 MiB into 1.45 GiB),
# across six attempts and every retry strategy tried. kiwi installs packages
# with dnf directly and has no equivalent downloader, so it sidesteps the
# failure rather than working around it. Fedora is also moving live ISOs from
# lorax to kiwi, so this is the direction upstream is going.

on:
  # Runs itself on any change to the build path. Dispatching by hand meant every
  # fix waited for someone to tap a button — which is not automation, it's a
  # reminder. build-iso.yml ignores these same paths, so the distro pipeline is
  # not triggered by kiwi work.
  push:
    paths:
      - 'packages/distro-iso-builder/kiwi/**'
      - 'scripts/ci-kiwi-build.sh'
      - '.github/workflows/build-iso-kiwi.yml'
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Name for the ISO (informational)'
        required: false
        default: 'kiwi'

permissions:
  contents: read

jobs:
  build-kiwi:
    name: Build live ISO with kiwi-ng
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space (kiwi needs ~20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Build with kiwi-ng (Fedora 44 container)
        # docker directly, not addnab/docker-run-action. That action received an
        # empty `image` input on this workflow and tried to pull a mangled tag
        # ("pull access denied for 916ccf:2bc7b25a…") on three consecutive runs,
        # even with the input present in the step's `with:` block. Calling docker
        # here removes the dependency and makes the command line explicit.
        #
        # --privileged is required: kiwi needs loop devices and mounts to
        # assemble the ISO. This is the main structural difference from the
        # livemedia-creator pipeline.
        run: |
          docker run --rm --privileged \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            fedora:44 \
            bash /workspace/scripts/ci-kiwi-build.sh

      - name: Stage the ISO where the uploader can read it
        if: success()
        run: |
          # kiwi-out/build/image-root contains root-owned directories created by
          # the chroot during the build. Uploading `kiwi-out/**/*.iso` makes the
          # artifact action walk that tree and die on EACCES — the build had
          # already succeeded by then. Copy the artefacts to a clean, runner-owned
          # directory and upload from there.
          mkdir -p dist
          cp -v kiwi-out/*.iso dist/ 2>/dev/null || true
          cp -v kiwi-out/*.iso.sha256 dist/ 2>/dev/null || true
          # write a checksum if kiwi did not, so the release always has one
          for f in dist/*.iso; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            [ -f "dist/$base.sha256" ] || sha256sum "$f" > "dist/$base.sha256"
          done
          ls -lh dist/
          cat dist/*.sha256 || true

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kaal-os-live-iso-kiwi
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload kiwi build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # no kiwi-out/build/ here: it is root-owned inside and the uploader
          # fails on it. The logs are what matters.
          name: kiwi-build-log
          path: |
            kiwi-out/*.log
            kiwi-out/build/*.log
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Boot the thing. "An ISO exists" and "it boots" are different claims, and
  # this project has already paid once for confusing a green report with a
  # working system. The authority here is the display, not the serial log:
  # grepping the log for a session name has matched package names and queued
  # unit names before, and declared a machine booted while it was still in
  # early boot.
  # ---------------------------------------------------------------------------
  boot-test:
    name: Boot the ISO under UEFI
    needs: build-kiwi
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the ISO from the build
        uses: actions/download-artifact@v4
        with:
          name: kaal-os-live-iso-kiwi
          path: dist

      - name: Unpack and identify it
        id: iso
        run: |
          cd dist
          ls -lh
          for z in *.zip; do [ -e "$z" ] && unzip -o -q "$z"; done
          ISO=$(ls -S *.iso 2>/dev/null | head -1)
          if [ -z "$ISO" ]; then echo "::error::no ISO in the artifact"; exit 1; fi
          echo "iso=$PWD/$ISO" >> "$GITHUB_OUTPUT"
          echo "iso_name=$ISO" >> "$GITHUB_OUTPUT"
          ls -l "$ISO"
          sha256sum "$ISO" || true
          if [ -f "$ISO.sha256" ]; then echo "--- published checksum ---"; cat "$ISO.sha256"; fi

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf python3-pil
          # UEFI needs the writable vars store, which the package does not install.
          cp /usr/share/OVMF/OVMF_VARS.fd ./OVMF_VARS.fd
          qemu-img create -f qcow2 test-disk.qcow2 24G

      - name: Start the VM
        env:
          ISO: ${{ steps.iso.outputs.iso }}
        run: |
          # accel=tcg: GitHub runners have no /dev/kvm, so this is full software
          # emulation and it will be slow. 4 GB of RAM because the image carries
          # five desktop environments and a toolchain.
          qemu-system-x86_64 \
            -name "kaal-kiwi-boot" \
            -machine q35,accel=tcg \
            -cpu max \
            -smp 4 \
            -m 4096 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=OVMF_VARS.fd \
            -drive file=test-disk.qcow2,if=virtio,format=qcow2 \
            -cdrom "$ISO" \
            -boot d \
            -vga virtio \
            -monitor unix:mon.sock,server,nowait \
            -serial file:serial.log \
            -display none \
            -daemonize
          sleep 3
          if ! pgrep -f qemu-system-x86_64 >/dev/null; then
            echo "::error::QEMU exited immediately — the VM never started"
            exit 1
          fi
          echo "VM running (pid $(pgrep -f qemu-system-x86_64 | head -1))"

      - name: Wait for a graphical session
        run: |
          # Software emulation of a 5 GB live image: be generous, and be honest
          # if it times out rather than calling it a pass.
          python3 scripts/ci-visual-check.py \
            --wait-graphical \
            --monitor mon.sock \
            --serial serial.log \
            --timeout 1800 \
            --interval 20 \
            --outdir bootcheck

      - name: Screenshot the result
        if: always()
        run: |
          mkdir -p shots
          # ask QEMU for one last frame regardless of how the check ended
          python3 - <<'PY' || true
          import socket, time, os
          try:
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.connect("mon.sock"); time.sleep(0.3); s.recv(65536)
              s.sendall(b"screendump shots/final.ppm\n"); time.sleep(1.5)
              print(s.recv(65536).decode(errors="replace"))
              s.close()
          except Exception as e:
              print("screendump failed:", e)
          PY
          python3 - <<'PY' || true
          from PIL import Image
          import glob, os
          for p in glob.glob("shots/*.ppm") + glob.glob("bootcheck/*.ppm"):
              try:
                  im = Image.open(p); out = os.path.splitext(p)[0] + ".png"; im.save(out)
                  cols = im.convert("RGB").getcolors(maxcolors=1000000)
                  print(f"{out}: {im.size[0]}x{im.size[1]}, {len(cols) if cols else '>1M'} colours")
              except Exception as e:
                  print(p, "->", e)
          PY
          ls -l shots bootcheck 2>/dev/null || true

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-boot-test
          path: |
            shots/
            bootcheck/
            serial.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop the VM
        if: always()
        run: pkill -f qemu-system-x86_64 || true
