# =============================================================================
# build-iso.yml — ISO Build Pipeline (free-tier friendly)
# =============================================================================
# Builds KAAL OS ISOs in a Fedora 44 container on GitHub Actions.
# No machine needed: a public repo gets free Actions minutes; a private
# repo gets 2000 min/month free.
#
# Two jobs:
#   1. minimal-test — the smoke build (distro-test-minimal.ks, no staging).
#      Proves repos + kickstart + lmc + anaconda work end to end.
#   2. full-build   — the real ISO (distro-live.ks) with all 7 packages
#      staged to /tmp/kaal-staging first, exactly like build-iso.sh does
#      on a local machine.
#
# Notes learned from the first runs:
#   - anaconda (used by lmc --no-virt) needs udev: start systemd-udevd in
#     the container or storage probing hangs forever.
#   - keep --tmp/--resultdir on the bind-mounted real filesystem; loop
#     mounts on the container's overlayfs can wedge.
#   - the lmc option is --compression, not --compress.
# =============================================================================

name: Build ISO

# One build per ref: a new push cancels the previous run instead of both
# competing for a runner and a disk.
concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'What to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - minimal-only
          - full-only
      compression:
        description: 'Squashfs compression — xz is smallest, zstd is much faster'
        required: true
        default: 'xz'
        type: choice
        options:
          - xz
          - zstd
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write   # the full-build job publishes a GitHub Release on v* tags

env:
  DISTRO_NAME: 'KAAL OS'
  RELEASEVER: '44'
  PKG_DIR: packages
  STAGE_DIR: /tmp/kaal-staging

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — minimal smoke build
  # ---------------------------------------------------------------------------
  minimal-test:
    name: Minimal test build (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: inputs.build_type != 'full-only'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Build minimal test ISO (Fedora 44 container)
        uses: addnab/docker-run-action@v3
        with:
          image: fedora:44
          options: |
            --privileged
            -v ${{ github.workspace }}:/workspace
            -e RELEASEVER=${{ env.RELEASEVER }}
          run: |
            set -euxo pipefail
            # Longer timeouts + more retries: Fedora mirrors occasionally stall.
            printf '[main]\ngpgcheck=1\ninstallonly_limit=3\nclean_requirements_on_remove=True\ntimeout=300\nretries=10\n' > /etc/dnf/dnf.conf

            dnf install -y lorax livemedia-creator pykickstart xorriso isomd5sum anaconda-tui systemd-udev

            # anaconda needs udev — not present in a plain container.
            # Without it, storage probing hangs forever.
            /usr/lib/systemd/systemd-udevd --daemon || true
            udevadm trigger || true
            timeout 60 udevadm settle || true

            cd /workspace/packages/distro-iso-builder
            ksvalidator distro-test-minimal.ks

            # Work on the bind-mounted real filesystem (loop mounts on the
            # container's overlayfs can hang anaconda)
            rm -rf /workspace/lmc-tmp /workspace/lmc-results
            mkdir -p /workspace/lmc-tmp
            # Retry once: mirror timeouts ("Failed to download packages") are
            # transient — a second pass often lands on a working mirror.
            set +e
            LMC_RC=1
            for attempt in 1 2; do
              rm -rf /workspace/lmc-results
              livemedia-creator \
                --ks distro-test-minimal.ks \
                --no-virt \
                --tmp /workspace/lmc-tmp \
                --resultdir /workspace/lmc-results \
                --releasever "${RELEASEVER}" \
                --make-iso \
                --iso-only \
                --extra-boot-args "console=tty0 console=ttyS0,115200" \
                --compression gzip \
                2>&1 | tee /workspace/build.log
              LMC_RC=${PIPESTATUS[0]}
              [ "${LMC_RC}" = "0" ] && break
              echo "=== smoke attempt ${attempt} failed (rc=${LMC_RC}) ==="
              [ "${attempt}" = "1" ] && { echo "retrying in 60s..."; sleep 60; }
            done
            set -e

            if [ "${LMC_RC}" != "0" ]; then
              echo "smoke build failed after 2 attempts — build.log tail:"
              tail -80 /workspace/build.log
              exit 1
            fi

            ls -lh /workspace/lmc-results/
            cp /workspace/lmc-results/*.iso /workspace/ 2>/dev/null || {
              echo "NO ISO PRODUCED — build.log tail:"; tail -80 /workspace/build.log; exit 1; }

      - name: Upload minimal test ISO
        uses: actions/upload-artifact@v4
        with:
          name: kaal-minimal-test-iso
          path: '*.iso'
          retention-days: 7
          compression-level: 0

  # ---------------------------------------------------------------------------
  # Job 2 — the real thing (~60-180 min on a 2-core runner)
  # ---------------------------------------------------------------------------
  full-build:
    name: Full KAAL OS ISO
    runs-on: ubuntu-latest
    timeout-minutes: 300
    needs: minimal-test
    if: >-
      !cancelled() && inputs.build_type != 'minimal-only' &&
      (needs.minimal-test.result == 'success' || inputs.build_type == 'full-only')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space (full build needs ~30 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Stage packages + build full ISO (Fedora 44 container)
        uses: addnab/docker-run-action@v3
        with:
          image: fedora:44
          options: |
            --privileged
            -v ${{ github.workspace }}:/workspace
            -e RELEASEVER=${{ env.RELEASEVER }}
            -e STAGE_DIR=${{ env.STAGE_DIR }}
          run: |
            set -euxo pipefail
            # Longer timeouts + more retries: Fedora mirrors occasionally stall.
            printf '[main]\ngpgcheck=1\ninstallonly_limit=3\nclean_requirements_on_remove=True\ntimeout=300\nretries=10\n' > /etc/dnf/dnf.conf

            dnf install -y lorax livemedia-creator pykickstart xorriso isomd5sum anaconda-tui systemd-udev

            # anaconda needs udev — not present in a plain container.
            /usr/lib/systemd/systemd-udevd --daemon || true
            udevadm trigger || true
            timeout 60 udevadm settle || true

            cd /workspace/packages/distro-iso-builder

            # ---- Stage all 7 packages (same loop as build-iso.sh) ----
            STAGE_DIR="${STAGE_DIR:-/tmp/kaal-staging}"
            rm -rf "$STAGE_DIR"; mkdir -p "$STAGE_DIR"
            for pkg in distro-bootloader distro-iso-builder distro-calamares \
                       distro-hardware kaal-spaces kaal-visual kaal-security; do
              if [ -d "../$pkg" ]; then
                cp -r "../$pkg" "$STAGE_DIR/"
                echo "staged: $pkg"
              else
                echo "MISSING PACKAGE: $pkg"; exit 1
              fi
            done

            ksvalidator distro-live.ks
            echo "squashfs compression: ${{ inputs.compression || 'xz' }}"

            # Work on the bind-mounted real filesystem (loop mounts on the
            # container's overlayfs can hang anaconda)
            rm -rf /workspace/lmc-tmp /workspace/lmc-results
            mkdir -p /workspace/lmc-tmp
            set +e
            LMC_RC=1
            for attempt in 1 2; do
              rm -rf /workspace/lmc-results
              livemedia-creator \
                --ks distro-live.ks \
                --no-virt \
                --tmp /workspace/lmc-tmp \
                --resultdir /workspace/lmc-results \
                --releasever "${RELEASEVER}" \
                --project "KAAL OS" \
                --volid "KAAL_OS_LIVE" \
                --make-iso \
                --iso-only \
                --extra-boot-args "console=tty0 console=ttyS0,115200" \
                --compression ${{ inputs.compression || 'xz' }} \
                2>&1 | tee /workspace/build.log
              LMC_RC=${PIPESTATUS[0]}
              [ "${LMC_RC}" = "0" ] && break
              echo "=== full-build attempt ${attempt} failed (rc=${LMC_RC}) ==="
              [ "${attempt}" = "1" ] && { echo "retrying in 60s..."; sleep 60; }
            done
            set -e

            if [ "${LMC_RC}" != "0" ]; then
              echo "=== livemedia-creator exited ${LMC_RC} — dumping anaconda logs ==="
              # lorax novirt_install() copies /tmp/*log to <logfile dir>/anaconda/
              # (default logfile dir: ./lmc-logs/ under the CWD). Search everywhere.
              ls -la /workspace/packages/distro-iso-builder/lmc-logs/anaconda/ 2>/dev/null || \
                echo "(no lmc-logs/anaconda dir)"
              for name in packaging.log dnf.rpm.log program.log anaconda.log storage.log; do
                for f in $(find /workspace -name "$name" 2>/dev/null | head -2); do
                  echo "----- $f (tail 250) -----"
                  tail -250 "$f"
                done
              done
              for f in /tmp/*log; do
                [ -f "$f" ] || continue
                echo "----- $f (tail 100) -----"
                tail -100 "$f"
              done
              echo "----- build.log tail 60 -----"
              tail -60 /workspace/build.log
              exit 1
            fi

            # Verify the staged packages actually made it into the image
            echo "=== Verifying staged content in built rootfs ==="
            ls /workspace/lmc-tmp/install_root/usr/libexec/distro-installer/ 2>/dev/null | head -30 || true

            cp /workspace/lmc-results/*.iso /workspace/ 2>/dev/null || {
              echo "NO ISO PRODUCED — build.log tail:"; tail -80 /workspace/build.log; exit 1; }

      - name: Checksum and rename
        run: |
          ISO_FILE=$(ls *.iso | head -1)
          DATE=$(date '+%Y%m%d')
          NEW_NAME="KAAL_OS_${DATE}_live_x86_64.iso"
          mv "$ISO_FILE" "$NEW_NAME"
          sha256sum "$NEW_NAME" > "$NEW_NAME.sha256"
          ls -lh

      - name: Upload full ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaal-os-live-iso
          path: |
            KAAL_OS_*_live_x86_64.iso
            KAAL_OS_*_live_x86_64.iso.sha256
            build.log
          retention-days: 14
          compression-level: 0

      # ---- On a version tag, publish the Release straight from this job ----
      # The ISO is already on this runner, so it is split HERE instead of
      # downloading the ~7 GB artifact in a separate job — that download was
      # repeatedly cancelled by the runner.
      - name: Split the ISO into <2 GiB parts
        if: startsWith(github.ref, 'refs/tags/v')
        id: split
        run: |
          set -euo pipefail
          ISO=$(ls KAAL_OS_*_live_x86_64.iso | head -1)
          NAME="$(basename "$ISO")"
          mkdir -p out
          split -b 1900M -d --suffix-length=2 "$ISO" "out/${NAME}.part-"
          ( cd out && sha256sum ./*.part-* > SHA256SUMS )
          cp "${NAME}.sha256" "out/${NAME}.sha256"
          ISO_SHA=$(awk '{print $1}' "${NAME}.sha256")
          {
            echo "KAAL OS ISO - download manifest"
            echo "iso=${NAME}"
            echo "sha256=${ISO_SHA}"
            echo "part_size=1900M"
            for p in out/"${NAME}".part-*; do
              echo "part=$(basename "$p")"
            done
          } > out/MANIFEST.txt
          cp scripts/download-iso.sh scripts/download-iso.ps1 out/
          echo "iso_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "iso_sha=${ISO_SHA}" >> "$GITHUB_OUTPUT"
          echo "part_count=$(ls out/"${NAME}".part-* | wc -l)" >> "$GITHUB_OUTPUT"
          ls -lh out/
          df -h /

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "KAAL OS ${{ github.ref_name }} (test build)"
          draft: false
          prerelease: true
          files: out/*
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## KAAL OS ${{ github.ref_name }} — test build

            **Base:** Fedora 44 (x86_64) · **ISO:** ${{ steps.split.outputs.iso_name }} · **Parts:** ${{ steps.split.outputs.part_count }}

            This is a **pre-1.0 test build**, published so people can try it and
            give feedback. It is a live ISO: it runs from the USB stick and does
            not touch your installed system.

            ### Download (one command)

            The ISO is split into parts, each under GitHub's 2 GiB per-file limit.
            The script below downloads every part, checks all the checksums,
            reassembles the ISO and verifies it:

            ```bash
            # Linux / macOS
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/download-iso.sh | bash -s -- ${{ github.ref_name }}
            ```

            ```powershell
            # Windows (PowerShell)
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/download-iso.ps1 | iex
            ```

            Then write the ISO to a USB stick (16 GB recommended):
            - Windows: Rufus (rufus.ie) or balenaEtcher
            - Linux/macOS: `sudo dd if=${{ steps.split.outputs.iso_name }} of=/dev/sdX bs=4M status=progress oflag=sync`

            ### What's inside

            - **5 desktop environments:** KDE Plasma 6, GNOME, XFCE, Cinnamon, Sway
            - **Gaming:** Steam, Lutris, Wine, RetroArch, PCSX2, Dolphin, MangoHud, GameMode, Gamescope
            - **GPU:** NVIDIA akmod driver
            - **Installer:** Calamares
            - **Security:** ClamAV, USBGuard, auditd, WireGuard/OpenVPN
            - **Development:** gcc, clang, Rust, Go, Java 25
            - **Daily:** Firefox, LibreOffice, GIMP, Blender, Krita, Kdenlive, OBS
            - BIOS + UEFI bootable · autologin as `liveuser`

            Built entirely in GitHub Actions from the scripts in this repository.

            ### Checksums

            - Per part: `SHA256SUMS`
            - Whole ISO: `${{ steps.split.outputs.iso_name }}.sha256` → `${{ steps.split.outputs.iso_sha }}`

            ### Known issues

            - Pre-1.0 software: expect rough edges.
            - The full desktop stack is heavy; on 4 GB RAM pick XFCE or Sway.
            - NVIDIA drivers build on first boot (akmod), which takes a while.

      # ---- Boot test: does it actually boot? Screenshots are the proof ----
      # GitHub runners have no KVM, so this is software emulation: slow, but it
      # captures the real guest display through the QEMU monitor. Non-fatal on
      # purpose — the build has already succeeded by the time this runs.
      - name: Boot test in QEMU (screenshot proof)
        id: boottest
        continue-on-error: true
        timeout-minutes: 75
        run: |
          set -uo pipefail
          ISO=$(ls KAAL_OS_*_live_x86_64.iso | head -1)
          if [ -z "$ISO" ]; then
            echo "::warning::no ISO on disk for the boot test"
            exit 0
          fi
          echo "ISO under test: $ISO"

          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf >/dev/null
          pip install -q pillow >/dev/null 2>&1 || true

          mkdir -p boottest
          CODE=$(ls /usr/share/OVMF/OVMF_CODE*.fd 2>/dev/null | head -1)
          VARS=$(ls /usr/share/OVMF/OVMF_VARS*.fd 2>/dev/null | head -1)
          if [ -z "$CODE" ] || [ -z "$VARS" ]; then
            echo "::warning::no OVMF firmware found; skipping the boot test"
            exit 0
          fi
          cp "$VARS" boottest/OVMF_VARS.fd

          # -display none keeps the framebuffer alive while opening no window,
          # so the monitor's screendump can still capture it.
          qemu-system-x86_64 \
            -machine q35,accel=tcg -cpu max -smp 4 -m 4096 \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file=boottest/OVMF_VARS.fd \
            -cdrom "$ISO" -boot d \
            -vga std -display none \
            -serial file:boottest/serial.log \
            -monitor unix:boottest/mon.sock,server,nowait &
          echo $! > boottest/qemu.pid
          sleep 20

          # 16 shots, 3 minutes apart = ~48 minutes of watching it come up.
          # The first live boot also builds the NVIDIA akmod, which is slow
          # under emulation, so give it room to reach the desktop.
          #
          # --diagnose then logs in as liveuser and screenshots the answers to a
          # few questions (default target, is sddm enabled, what failed, which
          # sessions exist). Screenshots alone can show *that* the desktop did
          # not come up, never *why*.
          python3 scripts/ci-boot-screenshot.py \
            --monitor boottest/mon.sock --outdir boottest \
            --interval 180 --count 16 --press-enter-first --diagnose \
            --login-user liveuser --login-pass kaal-live || true

          kill "$(cat boottest/qemu.pid)" 2>/dev/null || true
          echo "--- boot test output ---"
          ls -lh boottest/ || true
          echo "--- serial log (last 40 lines) ---"
          tail -40 boottest/serial.log 2>/dev/null || echo "(no serial output)"
          echo "screenshots=$(ls boottest/*.png 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload boot-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaal-boot-test-screenshots
          path: |
            boottest/*.png
            boottest/serial.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "## KAAL OS ISO Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Fedora base: ${RELEASEVER} · staged packages: 7" >> $GITHUB_STEP_SUMMARY
          echo "Download the ISO from this run's **Artifacts** section (top of page)." >> $GITHUB_STEP_SUMMARY
          echo "Artifact retention: 14 days — re-run the workflow for a fresh one." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Boot test: see the **kaal-boot-test-screenshots** artifact (the guest display, captured every 3 min)." >> $GITHUB_STEP_SUMMARY
