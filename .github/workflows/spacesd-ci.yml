name: Spaces service CI

# Runs the spacesd test suite on every change to the web shell / local service.
# Before this existed, those 28 assertions only ran when someone remembered to
# run them by hand — which is the same class of "we'll check it later" that let
# the ISO pipeline ship false greens for a week.

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/spacesd-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/spacesd-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: spacesd tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two versions, so a stdlib API that moved gets caught. 3.9 was here
        # first and failed with "not found for Ubuntu 26.04" — the runner image
        # no longer ships a 3.9 build, so asking for it tested nothing.
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile everything first
        run: python -m compileall -q web

      - name: Run the suite
        run: python web/test_spacesd.py

  ui:
    name: web shell is self-contained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: No external network references
        # The shell must work offline, on a phone, with no CDN. If a font or a
        # script ever gets pulled from a remote host this fails, which is the
        # point: the offline claim is a product claim, not a preference.
        run: |
          python - <<'PY'
          import re, sys
          html = open('web/index.html', encoding='utf-8').read()
          refs = re.findall(r'(?:src|href)\s*=\s*"(https?://[^"]+)"', html)
          if refs:
              print("external references found:")
              for r in refs:
                  print("  -", r)
              sys.exit("web/index.html must be self-contained")
          print("no external references — self-contained")
          PY

      - name: Extract the inline script
        run: |
          python - <<'PY'
          import re
          html = open('web/index.html', encoding='utf-8').read()
          m = re.search(r'<script>(.*?)</script>', html, re.S)
          assert m, "no inline script found"
          open('/tmp/ui.js', 'w', encoding='utf-8').write(m.group(1))
          print(f"extracted {len(m.group(1))} chars of JS")
          PY

      - name: JavaScript parses
        run: node --check /tmp/ui.js

      - name: Tag balance
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          VOID = {'meta','link','br','img','input','hr','source','canvas','area',
                  'base','col','embed','param','track','wbr'}
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.stack=[]; self.errs=[]
              def handle_starttag(self, t, a):
                  if t not in VOID: self.stack.append(t)
              def handle_endtag(self, t):
                  if t in VOID: return
                  if not self.stack: self.errs.append(f'extra </{t}>'); return
                  if self.stack[-1] == t: self.stack.pop()
                  else: self.errs.append(f'expected </{self.stack[-1]}> got </{t}>')
          p = P(); p.feed(open('web/index.html', encoding='utf-8').read())
          if p.errs or p.stack:
              print("errors:", p.errs); print("unclosed:", p.stack)
              raise SystemExit("web/index.html has unbalanced tags")
          print("tags balanced")
          PY
