# =============================================================================
# /etc/default/grub.d/10-distro-gpu.conf — GPU-Specific Kernel Parameters
# =============================================================================
# This drop-in is sourced by grub2-mkconfig via /etc/grub.d/00_header.
# It detects the installed GPU and appends the correct kernel parameters
# to GRUB_CMDLINE_LINUX.
#
# The actual GPU detection happens in /etc/grub.d/06-distro-gpu-params
# which reads this file and the lspci output to build the final command line.
# =============================================================================

# ---- NVIDIA Parameters ----
# Applied when an NVIDIA RTX 40-series+ GPU is detected:
#   nvidia-drm.modeset=1         — Enable Wayland-compatible modesetting (REQUIRED)
#   nvidia_drm.fbdev=1            — Enable framebuffer device for NVIDIA
#   modprobe.blacklist=nouveau    — Disable the open-source nouveau driver
#   rd.driver.pre=nvidia          — Pre-load NVIDIA driver in initramfs
#   rd.driver.pre=nvidia_modeset  — Pre-load NVIDIA modeset module
#   rd.driver.pre=nvidia_drm      — Pre-load NVIDIA DRM module
#   rd.driver.pre=nvidia_uvm      — Pre-load NVIDIA UVM (compute/CUDA)
#
DISTRO_NVIDIA_PARAMS="nvidia-drm.modeset=1 nvidia_drm.fbdev=1 modprobe.blacklist=nouveau rd.driver.pre=nvidia rd.driver.pre=nvidia_modeset rd.driver.pre=nvidia_drm rd.driver.pre=nvidia_uvm"

# ---- AMD Parameters ----
# Applied when an AMD RDNA2+ GPU is detected:
#   amdgpu.ppfeaturemask=0xffffffff  — Enable full PowerPlay controls (overclocking, fan curves)
#   rd.driver.pre=amdgpu             — Pre-load amdgpu driver in initramfs
#   amdgpu.si_support=amdgpu         — Use amdgpu for Southern Islands (HD 7000)
#   amdgpu.cik_support=amdgpu        — Use amdgpu for Sea Islands (HD 8000 / R9 290)
#
DISTRO_AMD_PARAMS="amdgpu.ppfeaturemask=0xffffffff rd.driver.pre=amdgpu amdgpu.si_support=amdgpu amdgpu.cik_support=amdgpu"

# ---- Intel iGPU Parameters ----
# Applied when an Intel CPU with integrated graphics is detected:
#   i915.enable_guc=3              — Enable GuC submission + HuC firmware loading (Gen 12+)
#   i915.fastboot=1                — Skip modeset on initial boot (faster boot, less flicker)
#   rd.driver.pre=i915             — Pre-load Intel graphics driver
#
DISTRO_INTEL_PARAMS="i915.enable_guc=3 i915.fastboot=1 rd.driver.pre=i915"

# ---- Gaming / Performance Parameters (applied to all) ----
#   split_lock_detect=off          — Disable split-lock detection (improves game performance)
#   tsc=reliable                   — Trust the TSC (reduces latency on modern CPUs)
#   clocksource=tsc                — Use TSC as clocksource (lowest overhead)
#   preempt=full                   — Full preemption for lower latency
#   transparent_hugepage=madvise   — Only use THP when explicitly requested (avoids latency spikes)
#
DISTRO_GAMING_PARAMS="split_lock_detect=off preempt=full transparent_hugepage=madvise"

# ---- CPU Mitigation Tuning ----
# By default, Fedora enables all Spectre/Meltdown mitigations which cost performance.
# For a gaming distro, we offer a balanced mode that keeps critical mitigations
# but disables the most expensive ones. Users can opt for full security via
# kaal-tweak-tool.
#
#   mitigations=off                — Disable all CPU mitigations (max performance, less secure)
#
# Default: balanced (comment out the next line for full mitigations)
DISTRO_SECURITY_PARAMS="mitigations=off"
