# =============================================================================
# /etc/default/grub.d/20-distro-resume.conf — Hibernate Resume Configuration
# =============================================================================
# Auto-generated by the installer. Points the kernel to the swap device
# for hibernation resume. When using zram (default), this is set to the
# swapfile on the root filesystem or left empty.
#
# For swap partition:    resume=UUID=<swap-partition-uuid>
# For swapfile:          resume=UUID=<root-uuid> resume_offset=<swapfile-offset>
# For zram-only (no hibernate): leave empty
# =============================================================================

# Placeholder — the installer will populate this during installation
# Example for swapfile on btrfs:
# GRUB_CMDLINE_LINUX_RESUME="resume=UUID=12345678-1234-1234-1234-123456789abc resume_offset=12345"
#
GRUB_CMDLINE_LINUX_RESUME=""
