# =============================================================================
# /etc/dracut.conf.d/10-distro-gpu.conf — GPU Driver Modules in Initramfs
# =============================================================================
# Dracut is the initramfs generator used by Fedora. This config ensures
# GPU driver modules are included in the initramfs so they're available
# at early boot — before the root filesystem is mounted.
#
# This is critical for:
#   - NVIDIA Wayland modesetting (nvidia_drm must load before display manager)
#   - AMD power play features (amdgpu must be early for proper init)
#   - Intel GuC/HuC firmware loading (i915 must be early for display)
#
# The modules listed here must also be present on the installed system
# (installed via dnf / akmod).
# =============================================================================

# ---- Force-include GPU driver modules ----
# These are added to the initramfs regardless of dracut's auto-detection.
add_drivers+=" nvidia nvidia_modeset nvidia_drm nvidia_uvm "
add_drivers+=" amdgpu "
add_drivers+=" i915 "

# ---- Include GPU firmware files ----
# Firmware blobs are needed by the drivers at load time.
install_items+=" /lib/firmware/nvidia/ "
install_items+=" /lib/firmware/amdgpu/ "
install_items+=" /lib/firmware/i915/ "

# ---- Include NVIDIA persistence daemon ----
install_items+=" /usr/bin/nvidia-persistenced "
install_items+=" /usr/lib/systemd/system/nvidia-persistenced.service "
