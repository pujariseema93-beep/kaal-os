# =============================================================================
# /etc/dracut.conf.d/20-distro-filesystem.conf — Filesystem & Storage Modules
# =============================================================================
# Ensures the initramfs has all the modules needed to mount the root
# filesystem and access storage devices.
# =============================================================================

# ---- Btrfs support (default filesystem) ----
add_drivers+=" btrfs "
# Btrfs userspace tools in initramfs for snapshot rollback
install_items+=" /usr/bin/btrfs "
install_items+=" /usr/sbin/btrfs "

# ---- LUKS encryption support ----
add_drivers+=" dm_crypt "
install_items+=" /usr/bin/cryptsetup "
# Include LUKS keyfile if using auto-unlock (installer-generated)
# install_items+=" /etc/luks-keys/ "

# ---- LVM support (if used) ----
add_drivers+=" dm_mod dm_mirror dm_snapshot dm_thin_pool "

# ---- NVMe and SATA drivers ----
add_drivers+=" nvme nvme_core nvme_common "
add_drivers+=" ahci libahci sd_mod "

# ---- USB storage (for live USB boots and external drives) ----
add_drivers+=" uas usb_storage usbhid "

# ---- zram (used for swap by default) ----
add_drivers+=" zram zsmalloc "

# ---- Filesystem modules ----
add_drivers+=" ext4 fat vfat exfat ntfs3 fuse "

# ---- Btrfs snapshot rollback support ----
# Allows booting from a specific snapshot subvolume
add_drivers+=" btrfs "
# Include the snapshot boot helper script
install_items+=" /usr/lib/dracut/distro-btrfs-snapshot.sh "
