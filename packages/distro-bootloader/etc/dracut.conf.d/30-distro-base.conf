# =============================================================================
# /etc/dracut.conf.d/30-distro-base.conf — Base Dracut Configuration
# =============================================================================
# General dracut settings that control how the initramfs is built and
# what features are available during early boot.
# =============================================================================

# ---- Compression ----
# zstd is the fastest with good compression ratio — ideal for fast boot
compress="zstd"

# ---- Hostonly mode ----
# Only include modules for the current hardware (smaller initramfs, faster boot)
hostonly="yes"
hostonly_cmdline="yes"

# ---- Include plymouth for boot splash ----
# Plymouth shows the boot animation. Theme to be configured later.
add_drivers+=" plymouth "
install_items+=" /usr/lib/plymouth/ "
install_items+=" /usr/lib/plymouth/renderers/ "

# ---- Include systemd in initramfs ----
# Required for dracut's systemd-based early boot
add_dracutmodules+=" systemd systemd-initrd "

# ---- Include network modules (for auto-update check on boot) ----
add_dracutmodules+=" network network-legacy "

# ---- Include resume from hibernate ----
add_dracutmodules+=" resume "

# ---- Btrfs snapshot boot module ----
add_dracutmodules+=" btrfs "

# ---- Include i18n / keyboard ----
i18n_vars="/etc/vconsole.conf"
i18n_default_font="eurlatgr"

# ---- Omit unnecessary modules ----
# These reduce initramfs size and boot time by excluding unused features
omit_dracutmodules+=" busybox "
# Keep if you need the emergency shell in initramfs
# omit_dracutmodules+=" emergency shell "

# ---- Kernel drivers to always include ----
# Input devices (keyboard/mouse for GRUB and early boot)
add_drivers+=" atkbd i8042 serio libps2 input-leds "
# Display
add_drivers+=" drm drm_kms_helper "
# Audio (for early Plymouth bell if needed)
# add_drivers+=" snd "
