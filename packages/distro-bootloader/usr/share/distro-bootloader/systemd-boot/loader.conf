# =============================================================================
# /usr/share/distro-bootloader/systemd-boot/loader.conf
# =============================================================================
# systemd-boot (formerly gummiboot) is a simpler, faster UEFI bootloader.
# This is the ALTERNATIVE bootloader — GRUB2 is the default on Fedora.
#
# To switch to systemd-boot, run:
#   kaal-bootloader-config --set systemd-boot
#
# This file is installed to /boot/efi/loader/loader.conf on the EFI System
# Partition (ESP).
# =============================================================================

# ---- Default entry ----
# "default" selects which entry to boot. Options:
#   @saved       — boot the last selected entry
#   <name>       — boot a specific entry by filename (without .conf)
#   <number>     — boot the Nth entry (0-indexed)
default @saved

# ---- Timeout ----
# Seconds to show the menu before booting default. Set to 0 to skip menu.
# Hold Space during boot to force-show the menu.
timeout 5

# ---- Console mode ----
# "auto" picks the best resolution. "max" uses the highest available.
# "keep" preserves the firmware's current mode.
console-mode auto

# ---- Editor ----
# Allow editing kernel command line at boot (press 'e' on an entry).
# Set to 0 to disable for security (prevents root=rescue bypass).
editor 1

# ---- Auto-entries ----
# Show auto-detected entries (Windows Boot Manager, other UEFI entries)
auto-entries 1

# ---- Auto-firmware ----
# Show "Reboot into Firmware" entry
auto-firmware 1

# ---- Random seed ----
# Generate a random seed for each boot (pass to kernel as RNG seed)
random-seed 1
