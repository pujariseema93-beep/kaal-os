---
title: "Bootloader"

options:
  - id: "grub2"
    label: "GRUB2"
    description: "The default Fedora bootloader. Mature, feature-rich, supports both UEFI and BIOS. Includes btrfs snapshot boot entries for rollback recovery and full theming support."
    icon: "system-software-install"
    supports_uefi: true
    supports_bios: true
    supports_snapshots: true
    recommended: true

  - id: "systemd-boot"
    label: "systemd-boot"
    description: "A simpler, faster UEFI-only bootloader. Individual config files per kernel. Less themeable but boots faster. Does not support btrfs snapshot boot menu."
    icon: "system-software-install"
    supports_uefi: true
    supports_bios: false
    supports_snapshots: false
    recommended: false

default: "grub2"
optional: false
