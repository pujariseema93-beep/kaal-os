---
title: "Desktop Environment"

desktops:
  - id: "kde"
    label: "KDE Plasma 6"
    description: "The most customizable full-featured desktop. Excellent Wayland support, VRR (FreeSync/G-Sync), HDR, fractional scaling, and gaming-friendly features. Recommended for most users."
    icon: "start-here-kde"
    display_manager: "sddm"
    package_group: "kde-desktop"
    ram_requirement: 2048
    recommended_for: ["gaming", "power-user"]
    wayland: true

  - id: "gnome"
    label: "GNOME 47"
    description: "Polished, distraction-free, minimal setup. First-class Wayland support, gesture integration, and a clean app ecosystem. Best for users who want a ready-to-use desktop."
    icon: "start-here-gnome"
    display_manager: "gdm"
    package_group: "gnome-desktop"
    ram_requirement: 2048
    recommended_for: ["daily"]
    wayland: true

  - id: "hyprland"
    label: "Hyprland"
    description: "Dynamic tiling Wayland compositor with eye-catching animations, blur effects, and extreme customizability. For users who want a riced, keyboard-driven workflow."
    icon: "preferences-desktop"
    display_manager: "sddm"
    package_group: ""
    extra_packages: ["hyprland", "waybar", "wofi", "foot", "wl-clipboard", "swaylock", "swayidle", "dunst", "polkit-gnome"]
    ram_requirement: 1024
    recommended_for: ["power-user"]
    wayland: true

  - id: "sway"
    label: "Sway"
    description: "i3-compatible Wayland tiling compositor. Stable, minimal, and rock-solid. For users who want a tiling WM without the flashiness of Hyprland. Great for development."
    icon: "preferences-desktop"
    display_manager: "sddm"
    package_group: ""
    extra_packages: ["sway", "waybar", "wofi", "foot", "wl-clipboard", "swaylock", "swayidle"]
    ram_requirement: 1024
    recommended_for: ["power-user", "developer"]
    wayland: true

  - id: "xfce"
    label: "XFCE 4.20"
    description: "Lightweight, stable, and traditional desktop. Low resource usage makes it ideal for older hardware or users who want maximum performance headroom."
    icon: "start-here-xfce"
    display_manager: "lightdm"
    package_group: "xfce-desktop"
    ram_requirement: 1024
    recommended_for: ["minimal", "daily"]
    wayland: false

  - id: "cinnamon"
    label: "Cinnamon"
    description: "Familiar Windows-like layout with a traditional panel, menu, and taskbar. Good for users transitioning from Windows. X11 primary, Wayland support improving."
    icon: "start-here-cinnamon"
    display_manager: "lightdm"
    package_group: "cinnamon-desktop"
    ram_requirement: 1536
    recommended_for: ["daily"]
    wayland: false

default: "kde"
optional: false
