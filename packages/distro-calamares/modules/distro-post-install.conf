# =============================================================================
# distro-post-install.conf — Shell Process Module Configuration
# =============================================================================
# This configures the Calamares "shellprocess" module to run our
# post-install scripts in the correct order. The scripts read the
# context file written by the distro-context module to get the
# user's selections (profile, DE, bootloader).
#
# Place at: /etc/calamares/modules/distro-post-install.conf
# =============================================================================

---
# Run commands in the target system (chroot)
dontChroot: false

# Timeout in seconds (30 minutes — some installs are slow)
timeout: 1800

# Commands to run, in order. Each runs in the chroot of the target system.
# The context file at /etc/distro-bootloader/install-context.conf contains
# all user selections as shell variables.
#
# The scripts are installed at /usr/libexec/distro-installer/ by the ISO build.
commands:
  # 1. Source the context file and run GPU detection
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/01-gpu-detect.sh"

  # 2. Install the selected desktop environment
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/02-de-install.sh"

  # 3. Install the selected software profile
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/03-profile-install.sh"

  # 4. Install and configure the bootloader
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/04-bootloader-setup.sh"

  # 5. Configure auto-update on boot
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/05-auto-update-setup.sh"

  # 6. Apply system performance tuning
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/06-system-tuning.sh"

  # 7. Finalize and enable first-boot service
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/07-finalize.sh"
  # 8-16. Hardware configuration (firmware, network, bluetooth, audio,
  # power, display, input, usb, fonts)
  - "source /etc/distro-bootloader/install-context.conf && for s in /usr/libexec/distro-installer/0[89]-*.sh /usr/libexec/distro-installer/1[0-6]-*.sh; do [ -x $s ] && bash $s || true; done"

  # 17. KAAL Spaces setup (daemon, default space, state dirs)
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/17-spaces-setup.sh"

  # 18. Security hardening (sysctl, SELinux enforcing, firewall, auditd,
  # password quality, sshd off by default)
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/18-security-hardening.sh"

  # 19. USB device control (USBGuard: own hardware + HID allowed)
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/19-usbguard-setup.sh"

  # 20. Antivirus (ClamAV: signature updates on, on-demand scanning ready)
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/20-antivirus-setup.sh"

  # 21. VPN stack (WireGuard + OpenVPN + openconnect via NetworkManager)
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/21-vpn-setup.sh"
