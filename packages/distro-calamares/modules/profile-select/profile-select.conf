# =============================================================================
# profile-select.conf — Configuration for the profile-select module
# =============================================================================
# Defines the software profiles shown in the installer. Each profile
# corresponds to a .list file in /usr/share/distro/profiles/.
# =============================================================================

---
# Window title shown in the Calamares sidebar
title: "Software Profile"

# Profiles displayed to the user
profiles:
  - id: "gaming"
    label: "Gaming"
    description: "Steam, Proton, emulators, performance tools, OBS Studio, and game development tools. Optimized for NVIDIA RTX 40+ and AMD RDNA2+ GPUs."
    icon: "applications-games"        # Standard freedesktop icon name
    recommended_for: ["gamers"]
    packages_file: "gaming.list"

  - id: "developer"
    label: "Developer"
    description: "VS Code, JetBrains, Neovim, Rust, Python, Go, Podman, Docker, Distrobox, databases, and modern CLI tools. Full container and VM support."
    icon: "applications-development"
    recommended_for: ["developers"]
    packages_file: "developer.list"

  - id: "power-user"
    label: "Power User"
    description: "Hyprland, Sway, Waybar, system tuning tools, network utilities, and advanced CLI. For users who want maximum control and customization."
    icon: "preferences-system"
    recommended_for: ["power-users"]
    packages_file: "power-user.list"

  - id: "daily"
    label: "Daily Life"
    description: "Firefox, LibreOffice, Discord, Spotify, media players, creative tools, and cloud sync. Everything you need for everyday computing."
    icon: "applications-multimedia"
    recommended_for: ["everyone"]
    packages_file: "daily.list"

  - id: "minimal"
    label: "Minimal"
    description: "Base system with your chosen desktop environment only. No extra applications — install what you need later."
    icon: "system-software-install"
    recommended_for: ["advanced-users"]
    packages_file: "minimal.list"

  - id: "custom"
    label: "Custom"
    description: "Skip profile installation. You'll get the base system and can install packages manually after setup."
    icon: "preferences-desktop-personal"
    recommended_for: ["advanced-users"]
    packages_file: ""

# Default selected profile
default: "gaming"

# Allow the user to skip this step
optional: false
