# =============================================================================
# settings.conf — Calamares Master Configuration for KAAL OS
# =============================================================================
# This is the main Calamares configuration file. It defines the sequence
# of modules that run during installation — both view modules (UI screens)
# and job modules (background tasks).
#
# Place at: /etc/calamares/settings.conf
#
# The sequence has two phases:
#   1. "show" — UI screens the user interacts with
#   2. "exec"  — background jobs that perform the installation
#
# Our custom modules are inserted into both phases:
#   - profile-select       (show) — user picks software profile
#   - de-select             (show) — user picks desktop environment
#   - bootloader-select     (show) — user picks bootloader
#   - distro-context        (exec) — saves all selections for post-install
# =============================================================================

---
# ---- Branding ----
# References the branding directory in /usr/lib/calamares/branding/
branding: distro-default

# ---- Module sequence ----
sequence:

  # ===========================================================
  # PHASE 1: Show — UI screens presented to the user
  # ===========================================================
  - show:
      # --- Standard Calamares welcome ---
      - welcome

      # --- KAAL OS custom: Profile selection ---
      # User chooses: Gaming / Developer / Power User / Daily / Minimal / Custom
      - profile-select

      # --- KAAL OS custom: Desktop environment selection ---
      # User chooses: KDE / GNOME / Hyprland / Sway / XFCE / Cinnamon
      - de-select

      # --- KAAL OS custom: Space selection (Gaming/Dev/Power/Normal) ---
      - space-select

      # --- Standard: Locale and keyboard ---
      - locale
      - keyboard

      # --- Standard: Partitioning ---
      - partition

      # --- KAAL OS custom: Bootloader selection ---
      # User chooses: GRUB2 / systemd-boot
      - bootloader-select

      # --- Standard: User creation ---
      - users

      # --- Standard: Summary ---
      - summary

  # ===========================================================
  # PHASE 2: Exec — Background installation jobs
  # ===========================================================
  - exec:
      # --- Standard: Partition and mount ---
      - partition
      - mount

      # --- Standard: Unpack filesystem ---
      - unpackfs

      # --- Standard: Machine ID ---
      - machineid

      # --- Standard: fstab generation ---
      - fstab

      # --- Standard: Locale ---
      - locale
      - keyboard

      # --- Standard: User creation ---
      - users

      # --- KAAL OS custom: Save context ---
      # Aggregates all user selections into a context file that
      # the post-install scripts can read
      - distro-context

      # --- Standard: Display manager ---
      # Reads distroDisplayManager from global storage (set by de-select)
      - displaymanager

      # --- Standard: Network config ---
      - networkcfg

      # --- Standard: Hardware clock ---
      - hwclock

      # --- Standard: Services ---
      - services-systemd

      # --- Standard: Bootloader ---
      # Reads distroBootloader from global storage (set by bootloader-select)
      - bootloader

      # --- Standard: Packages (runs our post-install scripts) ---
      - packages

      # --- Standard: LUKS keyfile (if encrypted) ---
      - luksbootkeyfile

      # --- Standard: Plymouth config ---
      - plymouthcfg

      # --- Standard: Initramfs ---
      - initramfscfg
      - initramfs

      # --- KAAL OS custom: Post-install scripts ---
      # These run AFTER all standard modules.
      # They read the context file written by distro-context.
      # Implemented as a custom "shellprocess" module.
      - distro-post-install

      # --- Standard: Remove live user ---
      - removeuser

      # --- Standard: Finalize ---
      - finalize

  # ===========================================================
  # PHASE 3: Show — Final screen
  # ===========================================================
  - show:
      - finished

# ---- Branding settings ----
# These control the look of the installer UI.
# Full branding is configured in branding/distro-default/branding.desc
branding-style: sidebar

# ---- UI settings ----
# Whether the user can cancel installation
allow-cancel: true

# Whether to show the "Install" button on the summary page
prompt-install: true

# ---- Module instances ----
# Some modules can be instantiated multiple times with different configs.
# We don't use this, but it's here for reference.
instances:
  - id: distro-post-install
    module: shellprocess
    config: distro-post-install.conf
