# =============================================================================
# distro-post-install-v2.conf — Updated Post-Install Chain
# =============================================================================
# REPLACES the original distro-post-install.conf.
# Now includes all 16 scripts (01-07 original + 08-16 hardware).
#
# Install this as:
#   /etc/calamares/modules/distro-post-install.conf
# =============================================================================

---
# Run commands in the target system (chroot)
dontChroot: false

# Timeout in seconds (30 minutes)
timeout: 1800

commands:
  # === Core System Setup (01-07) ===

  # 1. GPU detection & driver setup
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/01-gpu-detect.sh"

  # 2. Desktop environment installation
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/02-de-install.sh"

  # 3. Software profile installation
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/03-profile-install.sh"

  # 4. Bootloader installation
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/04-bootloader-setup.sh"

  # 5. Auto-update system setup
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/05-auto-update-setup.sh"

  # 6. System performance tuning
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/06-system-tuning.sh"

  # 7. Finalize and enable first-boot service
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/07-finalize.sh"

  # === Hardware Configuration (08-16) ===

  # 8. Hardware firmware (WiFi, Bluetooth, webcam, sensors)
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/08-firmware-setup.sh"

  # 9. Network & WiFi (NetworkManager, wpa_supplicant, DNS, firewall)
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/09-network-setup.sh"

  # 10. Bluetooth (service, audio codec, Blueman, udev)
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/10-bluetooth-setup.sh"

  # 11. Audio/PipeWire (low-latency, Bluetooth audio, EasyEffects)
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/11-audio-setup.sh"

  # 12. Power management (suspend/resume, brightness, governor auto-switch)
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/12-power-setup.sh"

  # 13. Display & monitor (VRR, HDR, fractional scaling, multi-monitor)
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/13-display-setup.sh"

  # 14. Input devices (touchpad, Wacom, keyboard backlight, game controllers)
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/14-input-setup.sh"

  # 15. USB & auto-mount (udisks2, MTP, PTP, polkit, FUSE)
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/15-usb-setup.sh"

  # 16. Fonts & rendering (subpixel, hinting, CJK, Indic, emoji, fontconfig)
  - "source /etc/distro-bootloader/install-context.conf && /usr/libexec/distro-installer/16-fonts-setup.sh"
