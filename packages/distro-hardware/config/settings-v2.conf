# =============================================================================
# settings-v2.conf — Updated Calamares Settings for KAAL OS
# =============================================================================
# REPLACES the original settings.conf.
# Now includes the distro-hardware scripts in the exec sequence.
# Place at: /etc/calamares/settings.conf
# =============================================================================

---
branding: distro-default

sequence:

  # ===========================================================
  # PHASE 1: Show — UI screens
  # ===========================================================
  - show:
      - welcome
      - profile-select
      - de-select
      - locale
      - keyboard
      - partition
      - bootloader-select
      - users
      - summary

  # ===========================================================
  # PHASE 2: Exec — Background jobs (including hardware setup)
  # ===========================================================
  - exec:
      # Standard Calamares
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - users

      # KAAL OS context aggregator
      - distro-context

      # Standard system config
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - packages
      - luksbootkeyfile
      - plymouthcfg
      - initramfscfg
      - initramfs

      # KAAL OS post-install scripts (16 scripts in order)
      # 01-07: Core system (GPU, DE, profile, bootloader, auto-update, tuning, finalize)
      # 08-16: Hardware (firmware, WiFi, Bluetooth, audio, power, display, input, USB, fonts)
      - distro-post-install

      # Standard cleanup
      - removeuser
      - finalize

  - show:
      - finished

branding-style: sidebar
allow-cancel: true
prompt-install: true

instances:
  - id: distro-post-install
    module: shellprocess
    config: distro-post-install.conf
