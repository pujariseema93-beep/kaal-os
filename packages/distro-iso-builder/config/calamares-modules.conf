# =============================================================================
# calamares-modules.conf — Calamares Installer Module Configuration
# =============================================================================
# This defines the custom Calamares modules for KAAL OS.
# These modules add profile selection and DE selection screens to the
# installer. The actual module code would be Python plugins in
# /usr/lib/calamares/modules/
# =============================================================================

# ---- Welcome Module ----
# Standard Calamares welcome screen with distro branding
welcome:
  showSupportUrl: true
  showKnownIssuesUrl: true
  showReleaseNotesUrl: true
  requirements:
    requiredStorage: 20
    requiredRam: 4
    internetCheck: false  # Don't require internet for installation

# ---- Custom: Profile Selection Module ----
# Adds a screen where the user picks their software profile
profile-select:
  # Profiles are read from /usr/share/distro/profiles/*.list
  profiles:
    - name: gaming
      label: "Gaming"
      description: "Steam, Proton, emulators, performance tools, OBS"
      icon: "gaming"
    - name: developer
      label: "Developer"
      description: "IDEs, languages, containers, terminal tools, databases"
      icon: "developer"
    - name: power-user
      label: "Power User"
      description: "Tiling WMs, system tools, customization, networking"
      icon: "power-user"
    - name: daily
      label: "Daily Life"
      description: "Browser, office, media, creative apps, communication"
      icon: "daily"
    - name: minimal
      label: "Minimal"
      description: "Base system + desktop environment only"
      icon: "minimal"
    - name: custom
      label: "Custom"
      description: "Skip profile — install manually after setup"
      icon: "custom"
  default: gaming

# ---- Custom: DE Selection Module ----
# Adds a screen where the user picks their desktop environment
de-select:
  desktops:
    - name: kde
      label: "KDE Plasma 6"
      description: "Most customizable, gaming-friendly, VRR + HDR"
      recommended_for: ["gaming", "power-user"]
      icon: "kde"
    - name: gnome
      label: "GNOME 47"
      description: "Polished, minimal setup, distraction-free"
      recommended_for: ["daily"]
      icon: "gnome"
    - name: hyprland
      label: "Hyprland"
      description: "Dynamic tiling, animations, keyboard-driven"
      recommended_for: ["power-user"]
      icon: "hyprland"
    - name: sway
      label: "Sway"
      description: "i3-compatible tiling, stable, minimal"
      recommended_for: ["power-user", "developer"]
      icon: "sway"
    - name: xfce
      label: "XFCE 4.20"
      description: "Lightweight, traditional, low resource usage"
      recommended_for: ["minimal", "daily"]
      icon: "xfce"
    - name: cinnamon
      label: "Cinnamon"
      description: "Windows-like layout, beginner-friendly"
      recommended_for: ["daily"]
      icon: "cinnamon"
  default: kde

# ---- Custom: Bootloader Selection Module ----
bootloader-select:
  options:
    - name: grub2
      label: "GRUB2 (Default)"
      description: "Mature, supports UEFI + BIOS, btrfs snapshot booting"
      recommended: true
    - name: systemd-boot
      label: "systemd-boot"
      description: "Simpler, faster, UEFI-only"
      recommended: false
  default: grub2

# ---- Partition Module ----
partition:
  defaultFsType: btrfs
  enableLuks: true
  enableLvm: false  # Btrfs is default, LVM optional
  availableFsTypes:
    - btrfs
    - ext4
    - xfs
    - f2fs

# ---- Packages Module ----
# Runs the post-install scripts based on user selections
packages:
  backend: dnf5
  # The package operations are driven by the profile and DE selection
  # Custom scripts are executed here
  operations:
    - install:
        # Base packages always installed
        - btrfs-progs
        - grub2
        - grub2-efi-x64
        - shim-x64
        - dracut
        - NetworkManager
        - pipewire
        - wireplumber
        - flatpak
        - fwupd

# ---- Bootloader Module ----
bootloader:
  efiBootLoader: grub2
  kernelParams: "loglevel=3 systemd.show_status=0 vt.global_cursor_default=0"
  # GPU params are auto-detected by our 06-distro-gpu-params script

# ---- Display Manager Module ----
displaymanager:
  # Selected based on DE choice (kde→sddm, gnome→gdm, xfce/cinnamon→lightdm)
  # This is handled by the 02-de-install.sh post-install script

# ---- Services Module ----
services:
  enabled:
    - NetworkManager
    - bluetooth
    - pipewire
    - wireplumber
    - power-profiles-daemon
    - kaal-update-check.timer
    - distro-first-boot.service
  disabled:
    - smartd

# ---- Finalize Module ----
finalize:
  # Run our post-install scripts in order
  scripts:
    - /usr/libexec/distro-installer/01-gpu-detect.sh
    - /usr/libexec/distro-installer/02-de-install.sh
    - /usr/libexec/distro-installer/03-profile-install.sh
    - /usr/libexec/distro-installer/04-bootloader-setup.sh
    - /usr/libexec/distro-installer/05-auto-update-setup.sh
    - /usr/libexec/distro-installer/06-system-tuning.sh
    - /usr/libexec/distro-installer/07-finalize.sh
