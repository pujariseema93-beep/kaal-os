# =============================================================================
# kaal.conf — KAAL OS password quality policy (libpwquality)
# =============================================================================
# Installed to /etc/security/pwquality.conf.d/kaal.conf
# Balanced for a personal desktop: strong enough to resist trivial guesses,
# not so hostile that users write passwords on sticky notes.
# =============================================================================

# Minimum length
minlen = 10

# At least 3 of: lower, upper, digit, other
minclass = 3

# No more than 3 consecutive identical characters
maxrepeat = 3

# Check against the system dictionary
dictcheck = 1

# Refuse passwords containing the username
usercheck = 1

# Enforce at password change time
enforcing = 1
