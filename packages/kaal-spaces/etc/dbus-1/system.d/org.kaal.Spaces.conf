<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="org.kaal.Spaces"/>
  </policy>

  <!-- Any logged-in user can call methods -->
  <policy context="default">
    <allow send_destination="org.kaal.Spaces"
           send_interface="org.kaal.Spaces"/>
    <allow send_destination="org.kaal.Spaces"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.kaal.Spaces"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>

  <!-- Console users get extra privileges -->
  <policy group="wheel">
    <allow send_destination="org.kaal.Spaces"
           send_interface="org.kaal.Spaces"
           send_member="SwitchSpace"/>
    <allow send_destination="org.kaal.Spaces"
           send_interface="org.kaal.Spaces"
           send_member="SetDefaultSpace"/>
  </policy>

</busconfig>
