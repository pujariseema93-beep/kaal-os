# KAAL OS — Auto-Switch Rules Configuration
# Controls when spaces are automatically switched based on system context.
# Set enabled = false to disable all auto-switching.

[rules]
# Master switch
enabled = true

# Power-based switching
on_ac = gaming
on_battery = normal

# App-based switching — when these apps are focused, switch to the target space
# Format: app_keyword = target_space
steam = gaming
lutris = gaming
wine = gaming
bottles = gaming
heroic = gaming
code = development
vscodium = development
jetbrains = development
idea = development
pycharm = development
intellij = development
vim = development
neovim = development
terminal = power
konsole = power
htop = power
btop = power
gparted = power
cockpit = power
dnfdragora = power
firefox = normal
chrome = normal
chromium = normal
libreoffice = normal
rhythmbox = normal
totem = normal

# Time-based switching (optional, non-aggressive)
evening_time = normal
evening_start = 20
evening_end = 6

# Cooldown — don't switch more than once per N seconds
cooldown_seconds = 30
