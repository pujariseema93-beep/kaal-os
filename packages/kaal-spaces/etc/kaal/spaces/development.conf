# KAAL OS — Development Space Configuration
# This space is optimized for coding: dev tools, containers, tiling WM,
# terminal-focused, balanced power for long compile sessions.

[space]
name = Development
description = Development environment with IDEs, containers, terminal tools, and balanced power.
icon = /usr/share/kaal/spaces/development/icon.svg
color = #4A90D9

[system]
# CPU — balanced: performance on AC, powersave on battery
cpu_governor = schedutil
cpu_energy_perf = balance_performance
# GPU — auto, no need for max power
gpu_power_profile = auto
gpu_force_dedicated = false
# Audio — normal latency (no need for ultra-low)
audio_quantum = 256
audio_rate = 48000
# Compositor — on, but minimal effects for screen real estate
compositor_effects = true
compositor_vsync = true
# Network — normal
network_qos = false
# Notifications — allow but minimize
notifications = minimal
# Bluetooth — on for headphones
bluetooth = on

[services]
# Enable development services
enable = docker.service, podman.socket, libvirtd.service, cockpit.socket
# Disable gaming services (free resources)
disable = gamemoded.service, steam.service
# No audio restart needed
restart =

[desktop]
wallpaper = /usr/share/kaal/spaces/development/wallpaper.jpg
# Panel layout: terminal and IDE focused
panel_layout = development
# App menu: show development tools
app_menu_filter = development
# Pinned: IDE, terminal, git, docker, container tools
pinned_apps = code,org.gnome.Terminal,konsole,dbeaver,mdobsidian,org.gnome.gitg,docker-desktop,org.gnome.SystemMonitor
show_categories = Development,Utility,Terminal
hide_categories = Game

[environment]
# Development environment variables
DEV_MODE = 1
EDITOR = code
TERMINAL = gnome-terminal
# Enable container access
DOCKER_HOST = unix:///run/docker.sock
CONTAINER_MODE = distrobox
# Git
GIT_EDITOR = code --wait
# Python venv path
PYTHONPATH = /usr/lib/python3.12/site-packages:${HOME}/.local/lib/python3.12/site-packages
# Node
NODE_ENV = development

[hooks]
pre_enter = /usr/libexec/kaal-spaces/hooks/development-pre.sh
post_enter = /usr/libexec/kaal-spaces/hooks/development-post.sh
pre_exit = /usr/libexec/kaal-spaces/hooks/development-pre-exit.sh
post_exit = /usr/libexec/kaal-spaces/hooks/development-post-exit.sh
