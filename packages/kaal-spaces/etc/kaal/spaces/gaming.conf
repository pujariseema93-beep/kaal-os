# KAAL OS — Gaming Space Configuration
# This space optimizes the system for gaming: max performance, low latency,
# game launchers front and center, distractions minimized.

[space]
name = Gaming
description = Performance mode for gaming. CPU at max, GPU at max, low-latency audio, notifications muted.
icon = /usr/share/kaal/spaces/gaming/icon.svg
color = #FF6B35

[system]
# CPU performance — max clocks for frame stability
cpu_governor = performance
cpu_energy_perf = performance
# GPU — max power limit, prefer dedicated GPU
gpu_power_profile = performance
gpu_force_dedicated = true
# Audio — low latency for competitive gaming (quantum=64 = ~1.3ms at 48kHz)
audio_quantum = 64
audio_rate = 48000
# Compositor — disable effects for maximum FPS
compositor_effects = false
compositor_vsync = false
# Network — prioritize game traffic
network_qos = true
# Notifications — do not disturb
notifications = dnd
# Bluetooth — off unless controller
bluetooth = on

[services]
# Enable gaming services
enable = gamemoded.service
# Disable dev services (free resources)
disable = docker.service, podman.service, libvirtd.service, cockpit.service, clamonacc.service, clamd@scan.service
# Restart audio with new latency
restart = wireplumber.service, pipewire.service

[desktop]
# Wallpaper for this space
wallpaper = /usr/share/kaal/spaces/gaming/wallpaper.jpg
# Panel layout: game launcher focused
panel_layout = gaming
# App menu: show only games and game tools
app_menu_filter = games
# Pinned to taskbar/dock
pinned_apps = steam,lutris,bottles,heroicgameslauncher,luanti,mangohud,gamemode-settings
# Desktop entries to show
show_categories = Game,GameTool
hide_categories = Development,System,Settings

[environment]
# Set environment variables for this space
STEAM = 1
GAMEMODE = 1
MANGOHUD = 1
WINEESYNC = 1
WINEFSYNC = 1
DXVK_HUD = 0
# NVIDIA
__GL_SHADER_DISK_CACHE = 1
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP = 1

[hooks]
# Scripts to run when entering/leaving this space
pre_enter = /usr/libexec/kaal-spaces/hooks/gaming-pre.sh
post_enter = /usr/libexec/kaal-spaces/hooks/gaming-post.sh
pre_exit = /usr/libexec/kaal-spaces/hooks/gaming-pre-exit.sh
post_exit = /usr/libexec/kaal-spaces/hooks/gaming-post-exit.sh
