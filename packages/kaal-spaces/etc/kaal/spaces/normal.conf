# KAAL OS — Normal Space Configuration
# This space is for everyday use: web browsing, media, office, simple UI.
# Clean, friendly, balanced power, minimal complexity.

[space]
name = Normal
description = Everyday computing. Clean desktop, balanced power, simple UI, daily apps.
icon = /usr/share/kaal/spaces/normal/icon.svg
color = #2ECC71

[system]
# CPU — balanced, save power when possible
cpu_governor = powersave
cpu_energy_perf = balance_power
# GPU — auto, minimal power
gpu_power_profile = auto
gpu_force_dedicated = false
# Audio — normal latency
audio_quantum = 1024
audio_rate = 48000
# Compositor — on, full effects
compositor_effects = true
compositor_vsync = true
# Network — normal
network_qos = false
# Notifications — all
notifications = all
# Bluetooth — on
bluetooth = on

[services]
# Minimal services — only what daily users need
enable =
# Disable power-user and heavy dev services
disable = docker.service, podman.service, libvirtd.service, cockpit.socket, sshd.service, gamemoded.service
# No restarts
restart =

[desktop]
wallpaper = /usr/share/kaal/spaces/normal/wallpaper.jpg
# Panel layout: simple, app-grid focused
panel_layout = normal
# App menu: show daily-use apps, hide dev/system tools
app_menu_filter = daily
# Pinned: browser, office, media, files
pinned_apps = firefox,org.libreoffice.LibreOffice,org.gnome.Nautilus,org.gnome.TextEditor,rhythmbox,org.gnome.Screenshot
show_categories = Network,Office,AudioVideo,Graphics
hide_categories = Development,System

[environment]
# Normal user — hide system complexity
SIMPLIFIED = 1
HIDE_SYSTEM = 1
# Friendly defaults
EDITOR = gnome-text-editor
TERMINAL = gnome-terminal
# Power saving
POWER_SAVE = 1

[hooks]
pre_enter = /usr/libexec/kaal-spaces/hooks/normal-pre.sh
post_enter = /usr/libexec/kaal-spaces/hooks/normal-post.sh
pre_exit = /usr/libexec/kaal-spaces/hooks/normal-pre-exit.sh
post_exit = /usr/libexec/kaal-spaces/hooks/normal-post-exit.sh
