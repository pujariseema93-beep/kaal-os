# KAAL OS — Power User Space Configuration
# This space exposes everything: all system tools, verbose output,
# tiling window manager, full system access. For users who want control.

[space]
name = Power User
description = Full system access. All tools exposed, tiling WM, verbose logging, schedutil governor.
icon = /usr/share/kaal/spaces/power/icon.svg
color = #9B59B6

[system]
# CPU — schedutil for responsive scaling
cpu_governor = schedutil
cpu_energy_perf = performance
# GPU — balanced, available for compute
gpu_power_profile = balanced
gpu_force_dedicated = false
# Audio — normal
audio_quantum = 128
audio_rate = 48000
# Compositor — on but configurable
compositor_effects = true
compositor_vsync = true
# Network — full access, SSH enabled
network_qos = false
network_ssh = true
# Notifications — all
notifications = all
# Bluetooth — on
bluetooth = on

[services]
# Enable management and monitoring services
enable = cockpit.socket, sshd.service, sysstat.service, thermald.service
# Nothing disabled — power users want everything
disable =
# Restart monitoring
restart = sysstat-collect.service

[desktop]
wallpaper = /usr/share/kaal/spaces/power/wallpaper.jpg
# Panel layout: system stats and tools
panel_layout = power
# App menu: show everything including system tools
app_menu_filter = all
# Pinned: system monitors, config editors, terminal, partition tools
pinned_apps = org.gnome.Terminal,konsole,htop,btop,org.gnome.SystemMonitor,org.gnome.DiskUtility,gparted,dnfdragora,org.gnome.tweaks,cockpit
show_categories = Development,System,Settings,Utility,Network
hide_categories =

[environment]
# Power user environment
ROOT_TOOLS = 1
SHOW_SYSTEM = 1
VERBOSE = 1
# Enable core dumps for debugging
ulimit_core = unlimited
# Strace/ltrace in PATH
PATH = /usr/sbin:/usr/bin:/sbin:/bin:/usr/local/sbin:/usr/local/bin
# Terminal
TERMINAL = konsole
EDITOR = vim
VISUAL = vim

[hooks]
pre_enter = /usr/libexec/kaal-spaces/hooks/power-pre.sh
post_enter = /usr/libexec/kaal-spaces/hooks/power-post.sh
pre_exit = /usr/libexec/kaal-spaces/hooks/power-pre-exit.sh
post_exit = /usr/libexec/kaal-spaces/hooks/power-post-exit.sh
