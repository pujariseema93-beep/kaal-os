# KAAL OS — Blank Space Template
# A minimal starting point for creating your own custom space.

[space]
name = Custom
description = A custom KAAL Space. Edit this description to describe your space.
icon = /usr/share/kaal/spaces/normal/icon.svg
color = #888888

[system]
cpu_governor = schedutil
cpu_energy_perf = balance_performance
gpu_power_profile = auto
gpu_force_dedicated = false
audio_quantum = 256
audio_rate = 48000
compositor_effects = true
compositor_vsync = true
network_qos = false
notifications = all
bluetooth = on

[services]
enable =
disable =
restart =

[desktop]
wallpaper =
panel_layout = normal
app_menu_filter = all
pinned_apps =
show_categories =
hide_categories =

[environment]

[hooks]
pre_enter =
post_enter =
pre_exit =
post_exit =
