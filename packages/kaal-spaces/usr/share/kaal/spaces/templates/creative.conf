# KAAL OS — Creative/Design Space Template
# Optimized for digital art, photo editing, video editing, 3D modeling.
# Color-accurate, tablet pressure support, rendering tools.

[space]
name = Creative
description = Digital art and design. Color-accurate display, tablet support, rendering tools.
icon = /usr/share/kaal/spaces/templates/icons/creative.svg
color = #E67E22

[system]
cpu_governor = performance
cpu_energy_perf = performance
gpu_power_profile = balanced
gpu_force_dedicated = true
audio_quantum = 256
audio_rate = 48000
compositor_effects = true
compositor_vsync = true
network_qos = false
notifications = minimal
bluetooth = on

[services]
enable =
disable = gamemoded.service
restart =

[desktop]
wallpaper =
panel_layout = power
app_menu_filter = creative
pinned_apps = gimp,inkscape,krita,blender,darktable,obs-studio,org.gnome.ColorProfileViewer
show_categories = Graphics,AudioVideo,Office
hide_categories = Game

[environment]
CREATIVE_MODE = 1
# Color management
GIMP_COLOR_PROFILE = sRGB
# Blender GPU rendering
BLENDER_USER_RESOURCES = 1
# Tablet pressure (Wacom)
XCOLORD_PRESET = default
# OBS recording
OBS_VIDEO_PATH = /home/${USER}/Videos/OBS
