# KAAL OS — Kiosk Space Template
# Single-application kiosk mode. Locks to one app, full screen, no distractions.
# Useful for public displays, info kiosks, point-of-sale terminals.

[space]
name = Kiosk
description = Kiosk mode. Single application, fullscreen, no panel, locked down.
icon = /usr/share/kaal/spaces/templates/icons/kiosk.svg
color = #95A5A6

[system]
cpu_governor = ondemand
cpu_energy_perf = balance_power
gpu_power_profile = auto
gpu_force_dedicated = false
audio_quantum = 1024
audio_rate = 48000
compositor_effects = false
compositor_vsync = true
network_qos = false
notifications = off
bluetooth = off

[services]
enable =
disable = docker.service, podman.service, libvirtd.service, gamemoded.service, cockpit.socket, sshd.service
restart =

[desktop]
wallpaper =
panel_layout = kiosk
app_menu_filter = none
pinned_apps = firefox
show_categories =
hide_categories =

[environment]
KIOSK_MODE = 1
LOCKDOWN = 1
# Firefox kiosk mode
FIREFOX_KIOSK = 1
MOZ_DISABLE_NONLOCAL_NETWORK = 1
# Disable screen blanking
XDG_DESKTOP_PORTAL_DISABLE = 1
