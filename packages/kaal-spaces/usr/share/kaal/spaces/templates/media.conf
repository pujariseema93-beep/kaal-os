# KAAL OS — Media Center Space Template
# Optimized for watching movies, streaming, and media consumption.
# VSync on, full compositor effects, audio tuned for richness.

[space]
name = Media Center
description = Media consumption mode. VSync on, rich audio, streaming apps front and center.
icon = /usr/share/kaal/spaces/templates/icons/media.svg
color = #E74C3C

[system]
cpu_governor = ondemand
cpu_energy_perf = balance_performance
gpu_power_profile = auto
gpu_force_dedicated = false
audio_quantum = 1024
audio_rate = 48000
compositor_effects = true
compositor_vsync = true
network_qos = false
notifications = minimal
bluetooth = on

[services]
enable =
disable = docker.service, podman.service, libvirtd.service, gamemoded.service
restart =

[desktop]
wallpaper =
panel_layout = normal
app_menu_filter = media
pinned_apps = firefox,org.gnome.Totem,mpv,rhythmbox,org.gnome.Screenshot,spotify
show_categories = AudioVideo,Network,Graphics
hide_categories = Development,System

[environment]
MEDIA_MODE = 1
FORCE_VSYNC = 1
# Tell video players to use hardware acceleration
LIBVA_DRIVER_NAME = iHD
MOZ_DRM_DEVICE = /dev/dri/renderD128
