# KAAL OS — Security/Pentest Space Template
# For security researchers and penetration testers.
# Isolated network, security tools, VM support, verbose logging.

[space]
name = Security
description = Security research mode. Pentest tools, isolated network, VM support, verbose logging.
icon = /usr/share/kaal/spaces/templates/icons/security.svg
color = #1ABC9C

[system]
cpu_governor = performance
cpu_energy_perf = performance
gpu_power_profile = balanced
gpu_force_dedicated = false
audio_quantum = 256
audio_rate = 48000
compositor_effects = true
compositor_vsync = true
network_qos = false
network_ssh = true
notifications = all
bluetooth = off

[services]
enable = libvirtd.service, sshd.service, cockpit.socket, clamd@scan.service, clamonacc.service
disable = gamemoded.service
restart =

[desktop]
wallpaper =
panel_layout = power
app_menu_filter = all
pinned_apps = org.gnome.Terminal,burpsuite,wireshark,nmap,metasploit,john,org.gnome.SystemMonitor,org.gnome.DiskUtility
show_categories = Network,System,Development,Utility
hide_categories =

[environment]
SECURITY_MODE = 1
PENTEST_MODE = 1
# Enable core dumps for analysis
ulimit_core = unlimited
# Wireshark capture without root
WIRESHARK_PRIVILEGED = 1
# Metasploit framework path
MSF_PATH = /usr/share/metasploit-framework
