# KAAL OS — Study Space Template
# Focused environment for studying, reading, and research.
# Distractions minimized, comfortable reading mode, reference tools.

[space]
name = Study
description = Distraction-free study mode. Reading-optimized, focus timer, reference tools.
icon = /usr/share/kaal/spaces/templates/icons/study.svg
color = #3498DB

[system]
cpu_governor = schedutil
cpu_energy_perf = balance_power
gpu_power_profile = auto
gpu_force_dedicated = false
audio_quantum = 512
audio_rate = 48000
compositor_effects = true
compositor_vsync = true
network_qos = false
notifications = dnd
bluetooth = on

[services]
enable =
disable = docker.service, podman.service, libvirtd.service, gamemoded.service
restart =

[desktop]
wallpaper =
panel_layout = normal
app_menu_filter = study
pinned_apps = firefox,org.gnome.Evince,org.gnome.TextEditor,org.gnome.Calculator,org.gnome.clocks,zim
show_categories = Office,Network,Utility
hide_categories = Game,Development

[environment]
STUDY_MODE = 1
FOCUS_TIMER = pomodoro
DISTRACTION_FREE = 1
