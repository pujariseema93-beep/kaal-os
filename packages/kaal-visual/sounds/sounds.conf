# KAAL OS Sound Events — Freedesktop sound theme
# Replace .ogg files with your custom sounds.
# All sounds should be OGG Vorbis format, short duration (< 2 seconds).

[login]
file=login.ogg

[logout]
file=logout.ogg

[boot]
file=boot.ogg

[shutdown]
file=shutdown.ogg

[space-switch]
file=space-switch.ogg

[notification]
file=notification.ogg

[error]
file=error.ogg

[warning]
file=warning.ogg

[complete]
file=complete.ogg
